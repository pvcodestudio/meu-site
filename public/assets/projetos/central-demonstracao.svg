<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Nexo Atendimento — demonstração fictícia</title>
  <desc id="desc">Prévia ilustrativa da Central, com marca, campos e mensagens fictícios.</desc>
  <rect width="1672" height="941" fill="#eef3f8"/>
  <rect width="1672" height="138" fill="#155e75"/>
  <rect x="36" y="27" width="78" height="78" rx="18" fill="#edf9f7"/>
  <path d="M56 84V47h11l20 26V47h10v37H86L66 58v26Z" fill="#155e75"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="140" y="48" fill="#bce8e1" font-size="16">NEXO · EMPRESA FICTÍCIA</text>
    <text x="140" y="87" fill="#fff" font-size="34" font-weight="700">Central de Atendimento</text>
    <text x="140" y="114" fill="#d5ecef" font-size="16">Organização e cuidado em cada conversa.</text>
    <text x="1265" y="70" fill="#fff" font-size="18">Marina · Equipe de exemplo</text>
    <rect x="30" y="168" width="364" height="725" rx="17" fill="#fff" stroke="#d7e0ea"/>
    <text x="53" y="207" fill="#102033" font-size="23" font-weight="600">Dados do atendimento</text>
    <g fill="#607087" font-size="15">
      <text x="53" y="256">Nome do cliente</text><text x="53" y="352">Cidade</text>
      <text x="53" y="448">Protocolo ilustrativo</text><text x="53" y="544">Relato do cliente</text>
    </g>
    <g fill="#f6f8fb" stroke="#d7e0ea">
      <rect x="53" y="269" width="318" height="51" rx="7"/>
      <rect x="53" y="365" width="318" height="51" rx="7"/>
      <rect x="53" y="461" width="318" height="51" rx="7"/>
      <rect x="53" y="557" width="318" height="116" rx="7"/>
    </g>
    <g fill="#244154" font-size="18">
      <text x="68" y="301">Alex · Cliente fictício</text><text x="68" y="397">Cidade Exemplo</text>
      <text x="68" y="493">DEMO-001</text><text x="68" y="588">Orientação sobre o painel.</text>
      <text x="68" y="617">Mensagem criada apenas</text><text x="68" y="646">para esta demonstração.</text>
    </g>
    <rect x="53" y="714" width="318" height="131" rx="10" fill="#f0f8f7"/>
