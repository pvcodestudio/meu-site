    <g fill="#fff" stroke="#d7e0ea"><rect x="442" y="404" width="571" height="205" rx="13"/><rect x="1031" y="404" width="585" height="205" rx="13"/><rect x="442" y="630" width="571" height="205" rx="13"/><rect x="1031" y="630" width="585" height="205" rx="13"/></g>
    <g fill="#102033" font-size="22" font-weight="600"><text x="463" y="444">Primeiro contato</text><text x="1052" y="444">Confirmação da solicitação</text><text x="463" y="670">Acompanhamento do pedido</text><text x="1052" y="670">Atendimento concluído</text></g>
    <g fill="#607087" font-size="18"><text x="463" y="480">Olá, Alex! Sou Marina, da Nexo.</text><text x="463" y="510">Como posso ajudar você hoje?</text><text x="1052" y="480">Seu pedido de exemplo foi recebido.</text><text x="1052" y="510">Vamos conferir os próximos passos.</text><text x="463" y="706">Passando para compartilhar uma atualização</text><text x="463" y="736">sobre a sua solicitação ilustrativa.</text><text x="1052" y="706">Obrigado pela conversa!</text><text x="1052" y="736">A equipe de exemplo segue à disposição.</text></g>
    <g fill="#155e75"><rect x="463" y="546" width="97" height="37" rx="7"/><rect x="1052" y="546" width="97" height="37" rx="7"/><rect x="463" y="772" width="97" height="37" rx="7"/><rect x="1052" y="772" width="97" height="37" rx="7"/></g>
    <g fill="#fff" font-size="15"><text x="483" y="571">Copiar</text><text x="1072" y="571">Copiar</text><text x="483" y="797">Copiar</text><text x="1072" y="797">Copiar</text></g>
    <text x="835" y="925" fill="#607087" font-size="16" text-anchor="middle">Demonstração visual · Marca e mensagens fictícias · PVcoding Studio</text>
  </g>
