    <text x="70" y="808" fill="#607087" font-size="16">Nenhum dado é enviado.</text>
    <rect x="416" y="168" width="1226" height="725" rx="17" fill="#fff" stroke="#d7e0ea"/>
    <text x="442" y="213" fill="#102033" font-size="27" font-weight="600">Mensagens e scripts</text>
    <text x="442" y="244" fill="#607087" font-size="16">Exemplos fictícios para conhecer a interface.</text>
    <rect x="442" y="267" width="1174" height="54" rx="9" fill="#f6f8fb" stroke="#d7e0ea"/>
    <text x="462" y="301" fill="#8290a1" font-size="17">Buscar mensagem ou modelo...</text>
    <rect x="442" y="339" width="132" height="41" rx="8" fill="#155e75"/>
    <text x="461" y="366" fill="#fff" font-size="16">Mensagens</text>
